<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8fafc; --card:#fff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b; --soft:#94a3b8;
  --primary:#0f172a; --primary-hover:#1e293b; --emerald:#10b981; --emerald-bg:#ecfdf5; --emerald-text:#047857;
  --rose:#ef4444; --rose-bg:#fef2f2; --rose-text:#b91c1c;
  --sky:#0ea5e9; --sky-bg:#f0f9ff; --sky-text:#0369a1;
  --amber:#f59e0b; --amber-bg:#fffbeb; --amber-text:#b45309;
  --indigo:#6366f1;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.06);
  --radius:16px; --radius-sm:12px; --radius-xs:8px;
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
html{-webkit-text-size-adjust:100%;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.app{max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
body{height:100%;overflow:hidden}
.screens{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding-bottom:calc(104px + var(--safe-bottom))}
.header{flex-shrink:0}

/* Header */
.header{
  position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:calc(10px + var(--safe-top)) 16px 10px;
}
.header-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.header-title{display:flex;align-items:center;gap:10px;min-width:0}
.header-logo{
  width:36px;height:36px;border-radius:12px;background:var(--primary);
  display:flex;align-items:center;justify-content:center;color:var(--t-fff);flex-shrink:0;
}
.header-logo svg{width:18px;height:18px}
.header-actions{display:flex;align-items:center;gap:8px}
.header h1{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.header p{font-size:11px;color:var(--muted)}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;color:var(--muted);
  transition:background .15s;
}
.icon-btn:active{background:var(--t-f1f5f9)}
.icon-btn svg{width:17px;height:17px}

/* Main */
.main{padding:16px;display:flex;flex-direction:column;gap:16px}

/* Card */
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow);
}
.card-title{
  font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;
}
.card-title svg{width:14px;height:14px;color:var(--text)}

/* Selling price */
.price-input{position:relative}
.price-input input{
  width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--t-fff);padding:14px 56px 14px 16px;font-size:20px;font-weight:700;
  font-variant-numeric:tabular-nums;outline:none;color:var(--text);
  transition:border-color .15s,box-shadow .15s;
}
.price-input input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.price-suffix{
  position:absolute;right:16px;top:50%;transform:translateY(-50%);
  font-size:14px;font-weight:600;color:var(--soft);
}

/* Stats grid */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{
  position:relative;overflow:hidden;background:var(--card);border:1px solid var(--border);
  border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);
}
.stat-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--soft)}
.stat-value{margin-top:4px;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-sub{margin-top:2px;font-size:10px;color:var(--muted)}
.stat-icon{
  position:static;margin-bottom:8px;width:28px;height:28px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
}
.stat-icon svg{width:15px;height:15px}
.stat-bar{position:absolute;bottom:0;left:0;right:0;height:3px}
.stat-emerald .stat-icon{background:var(--emerald-bg);color:var(--emerald)}
.stat-emerald .stat-bar{background:linear-gradient(90deg,var(--emerald),#14b8a6)}
.stat-rose .stat-icon{background:var(--rose-bg);color:var(--rose)}
.stat-rose .stat-bar{background:linear-gradient(90deg,var(--rose),#dc2626)}
.stat-sky .stat-icon{background:var(--sky-bg);color:var(--sky)}
.stat-sky .stat-bar{background:linear-gradient(90deg,var(--sky),var(--indigo))}
.stat-amber .stat-icon{background:var(--amber-bg);color:var(--amber)}
.stat-amber .stat-bar{background:linear-gradient(90deg,var(--amber),#f97316)}

/* Fields */
.field{display:block;margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.field-icon{
  width:30px;height:30px;border-radius:8px;background:var(--t-f1f5f9);color:var(--muted);
  display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s;
}
.field:focus-within .field-icon{background:var(--primary);color:var(--t-fff)}
.field-icon svg{width:15px;height:15px}
.field-label{font-size:13px;font-weight:500;color:var(--t-334155)}
.field-input{position:relative}
.field-input input{
  width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
  background:var(--t-fff);padding:12px 50px 12px 14px;font-size:16px;font-weight:600;
  font-variant-numeric:tabular-nums;outline:none;color:var(--text);
  transition:border-color .15s,box-shadow .15s;
}
.field-input input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.field-suffix{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  font-size:13px;font-weight:500;color:var(--soft);
}
.field-hint{margin-top:4px;font-size:11px;color:var(--soft)}

/* Fabric result */
.fabric-result{
  margin-top:12px;border-radius:var(--radius-sm);
  background:linear-gradient(135deg,var(--t-f0f9ff),var(--t-eef2ff));border:1px solid var(--t-dbeafe);
  padding:12px 14px;
}
.fabric-result-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--sky-text)}
.fabric-result-value{margin-top:4px;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--t-0c4a6e)}
.fabric-result-formula{margin-top:2px;font-size:11px;color:rgba(3,105,161,.8)}

/* Alert */
.alert{
  margin-top:12px;border-radius:var(--radius-xs);padding:8px 12px;
  font-size:12px;font-weight:500;
}
.alert-rose{background:var(--rose-bg);color:var(--rose-text)}
.alert-emerald{background:var(--emerald-bg);color:var(--emerald-text)}
.alert-amber{background:var(--amber-bg);color:var(--amber-text)}

/* Breakdown */
.breakdown{display:flex;flex-direction:column;gap:8px}
.break-row{display:flex;align-items:center;gap:8px;font-size:12px}
.break-label{width:74px;flex-shrink:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.break-bar{flex:1;height:18px;border-radius:6px;background:var(--t-f1f5f9);overflow:hidden}
.break-fill{height:100%;border-radius:6px;transition:width .4s ease}
.break-amt{width:64px;flex-shrink:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500;color:var(--t-334155)}

/* Break-even grid */
.be-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.be-card{border-radius:var(--radius-sm);padding:12px;border:1px solid}
.be-amber{background:linear-gradient(135deg,var(--t-fffbeb),var(--t-fef3c7));border-color:var(--t-fde68a)}
.be-sky{background:linear-gradient(135deg,var(--t-f0f9ff),var(--t-e0f2fe));border-color:var(--t-bae6fd)}
.be-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.be-amber .be-label{color:var(--amber-text)}
.be-sky .be-label{color:var(--sky-text)}
.be-value{margin-top:4px;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.be-sub{margin-top:2px;font-size:10px;opacity:.8}
.be-sky .be-sub{color:var(--sky-text)}
.be-amber .be-value{color:var(--t-92400e)}
.be-sky .be-value{color:var(--t-0c4a6e)}

/* Action bar */
.actionbar-inline{margin-bottom:0}
.actionbar-inner{display:flex;gap:8px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:all .12s;
}
.btn svg{width:16px;height:16px}
.btn-ghost{
  border:1px solid var(--border);color:var(--muted);padding:12px 16px;
}
.btn-ghost:active{background:var(--t-f1f5f9)}
.btn-primary{
  flex:1;background:var(--primary);color:var(--t-fff);padding:12px;
}
.btn-primary:active{background:var(--primary-hover);transform:scale(.99)}

/* Modal */
.overlay{
  position:fixed;inset:0;z-index:30;background:var(--t-overlay);
  display:flex;align-items:flex-end;justify-content:center;padding:16px;
  animation:fade .2s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal{
  width:100%;max-width:380px;background:var(--t-fff);border-radius:var(--radius);
  padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.2);animation:slide .25s;
}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-head h3{font-size:16px;font-weight:700}
.modal-close{color:var(--soft);padding:4px}
.modal-close svg{width:20px;height:20px}
.modal input{
  width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;font-size:16px;outline:none;margin-bottom:16px;color:var(--text);
}
.modal input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,23,42,.08)}
.modal .btn-primary{width:100%}

/* Drawer */
.drawer-overlay{
  position:fixed;inset:0;z-index:30;background:var(--t-overlay);
  display:flex;justify-content:flex-end;animation:fade .2s;
}
.drawer{
  width:100%;max-width:380px;background:var(--t-fff);height:100%;overflow-y:auto;
  box-shadow:0 0 40px rgba(0,0,0,.15);animation:slideRight .25s;
}
@keyframes slideRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer-head{
  position:sticky;top:0;background:var(--t-fff);border-bottom:1px solid var(--border);
  padding:12px 16px;display:flex;align-items:center;justify-content:space-between;
}
.drawer-head h3{font-size:16px;font-weight:700}
.drawer-body{padding:12px}
.new-btn{
  width:100%;display:flex;align-items:center;gap:12px;border:1px dashed var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;
  font-size:14px;font-weight:500;color:var(--muted);transition:background .15s;
}
.new-btn:active{background:var(--t-f8fafc)}
.new-btn svg{width:18px;height:18px}
.saved-item{
  display:flex;align-items:center;gap:8px;border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:8px;transition:background .15s;
}
.saved-item.active{border-color:var(--primary);background:var(--t-f8fafc)}
.saved-item:active{background:var(--t-f8fafc)}
.saved-info{flex:1;min-width:0}
.saved-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-meta{font-size:11px;color:var(--soft)}
.saved-open{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;min-width:0}
.saved-open svg{width:16px;height:16px;color:var(--t-cbd5e1);flex-shrink:0}
.saved-del{
  width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:var(--t-cbd5e1);transition:all .15s;flex-shrink:0;
}
.saved-del:active{background:var(--rose-bg);color:var(--rose)}
.saved-del svg{width:15px;height:15px}
.empty{text-align:center;font-size:14px;color:var(--soft);padding:40px 0}

/* Toast */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:40;
  background:var(--primary);color:var(--t-fff);padding:8px 16px;border-radius:999px;
  font-size:14px;font-weight:500;box-shadow:0 4px 12px rgba(0,0,0,.2);
  animation:toastIn .25s;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

/* Spinner */
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:var(--t-fff);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Install hint */
.install-hint{
  margin:0 16px 16px;background:linear-gradient(135deg,var(--t-f0f9ff),var(--t-eef2ff));
  border:1px solid var(--t-dbeafe);border-radius:var(--radius);padding:12px 14px;
  font-size:12px;color:var(--sky-text);display:flex;align-items:flex-start;gap:8px;
}
.install-hint svg{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.install-hint strong{font-weight:700}
/* Sections: only the active one is shown */
.tab{display:none}
.tab.active{display:block}

/* Bottom dock: matte glass; active section is a lighter matte pill */
:root{
  --dock-bg:rgba(255,255,255,.45); --dock-border:rgba(255,255,255,.75); --dock-hl:rgba(255,255,255,.9);
  --dock-shadow:0 10px 30px rgba(15,23,42,.14); --dock-item:#64748b;
  --dock-active-bg:rgba(15,23,42,.10); --dock-active-text:#0f172a; --dock-active-border:rgba(15,23,42,.06);
}
.dock{
  position:fixed;bottom:0;left:0;right:0;z-index:25;display:flex;justify-content:center;
  padding:0 16px calc(10px + var(--safe-bottom));pointer-events:none;
}
.dock-inner{
  pointer-events:auto;display:flex;gap:6px;width:100%;max-width:360px;
  background:var(--dock-bg);
  backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);
  border:1px solid var(--dock-border);border-radius:30px;padding:6px;
  box-shadow:inset 0 1px 0 var(--dock-hl),var(--dock-shadow);
}
.dock-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:9px 4px;border-radius:24px;font-size:11px;font-weight:600;color:var(--dock-item);
  border:1px solid transparent;transition:background .2s,color .2s;
}
.dock-item svg{width:22px;height:22px}
.dock-item.active{
  color:var(--dock-active-text);background:var(--dock-active-bg);border-color:var(--dock-active-border);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.dock-item:active{transform:scale(.97)}

/* Delivery: two small tiles side by side */
.delivery-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.delivery-grid .field{
  margin:0;background:var(--t-f8fafc);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;
}
.delivery-grid .field-label{font-size:12px}
.delivery-grid .field-input input{padding:10px 40px 10px 12px;font-size:15px}
.delivery-grid .field-suffix{right:12px}

/* Simple section cards */
.empty-state{text-align:center;padding:48px 16px;color:var(--soft);font-size:14px}
.empty-state svg{width:44px;height:44px;margin:0 auto 12px;display:block;color:var(--t-cbd5e1)}
.profile-avatar{
  width:64px;height:64px;border-radius:50%;background:var(--primary);color:var(--t-fff);
  display:flex;align-items:center;justify-content:center;margin:0 auto 16px;
}
.profile-avatar svg{width:28px;height:28px}
.profile-input{
  width:100%;border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 14px;font-size:16px;outline:none;color:var(--text);margin-top:6px;
}
.profile-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,23,42,.08)}

/* ===== Dark theme ===== */
.alert-muted{background:var(--t-f1f5f9);color:var(--t-64748b)}
/* ===== Soft monochrome redesign (light) ===== */
:root{
  --bg:#f2f2f2; --card:#ebebeb; --border:transparent; --text:#141414; --muted:#6b6b6b; --soft:#9a9a9a;
  --primary:#141414; --primary-hover:#2a2a2a;
  --emerald:#141414; --emerald-bg:#dedede; --emerald-text:#141414;
  --rose:#141414; --rose-bg:#dedede; --rose-text:#141414;
  --sky:#141414; --sky-bg:#dedede; --sky-text:#3a3a3a;
  --amber:#141414; --amber-bg:#dedede; --amber-text:#3a3a3a; --indigo:#141414;
  --shadow:none; --radius:26px; --radius-sm:18px; --radius-xs:14px;
  --dock-bg:#f7f7f7; --dock-border:rgba(255,255,255,.9); --dock-hl:#fff;
  --dock-shadow:0 18px 40px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04); --dock-item:#5c5c5c;
  --dock-active-bg:#e3dfdd; --dock-active-text:#141414; --dock-active-border:transparent;
}
:root body{background:linear-gradient(180deg,var(--t-f7f7f7),var(--t-ededed));letter-spacing:-.01em}
:root .header{background:var(--t-header);border-bottom:none}
:root .header-logo{border-radius:14px;background:var(--primary)}
:root .icon-btn{border:none;background:var(--t-fafafa);border-radius:50%;color:var(--text);box-shadow:0 6px 16px rgba(0,0,0,.07)}
:root .card,:root .stat{background:var(--card);border:none;box-shadow:none}
:root .card-title{text-transform:none;letter-spacing:-.01em;font-size:17px;font-weight:600;color:var(--text)}
:root .card-title svg{width:20px;height:20px}
:root .stat-label{text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--text)}
:root .stat-value{font-size:22px;letter-spacing:-.03em;font-weight:700}
:root .stat-sub{font-size:12px;color:var(--t-7a7a7a)}
:root .stat-icon{background:transparent!important;color:var(--text)!important;width:auto;justify-content:flex-start}
:root .stat-icon svg{width:20px;height:20px}
:root .stat-bar{background:var(--primary)!important;height:4px;left:14px;right:14px;bottom:10px;border-radius:4px;opacity:.85}
:root .field-icon{background:var(--t-f6f6f6);color:var(--text);border-radius:50%}
:root .field:focus-within .field-icon{background:var(--primary);color:var(--t-fff)}
:root .field-label{color:var(--text)}
:root .field-input input,:root .price-input input,
:root .modal input,:root .profile-input{background:var(--t-f7f7f7);border:1px solid transparent;border-radius:16px;color:var(--text)}
:root .price-input input{font-size:30px;letter-spacing:-.03em;padding:16px 60px 16px 18px}
:root input:focus{border-color:var(--primary)!important;box-shadow:0 0 0 4px rgba(20,20,20,.06)!important}
:root .delivery-grid .field{background:var(--t-f4f4f4);border:none;border-radius:18px}
:root .fabric-result,:root .install-hint{background:var(--t-f6f6f6);border:none;color:var(--t-3a3a3a)}
:root .fabric-result-value{color:var(--text);font-size:22px;letter-spacing:-.03em}
:root .fabric-result-formula,:root .fabric-result-label{color:var(--t-7a7a7a)}
:root .alert{border-radius:14px;background:var(--t-f6f6f6)!important;color:var(--text)!important}
:root .break-bar{background:var(--t-dcdcdc);border-radius:99px;height:10px}
:root .break-fill{border-radius:99px;transition:width .6s cubic-bezier(.22,1,.36,1)}
:root .break-amt{color:var(--text)}
:root .be-card{background:var(--t-f6f6f6)!important;border:none!important;border-radius:18px}
:root .be-label,:root .be-sub{color:var(--t-7a7a7a)!important;text-transform:none;letter-spacing:0;font-size:12px}
:root .be-value{color:var(--text)!important;font-size:20px;letter-spacing:-.03em}
:root .btn{border-radius:999px}
:root .btn-ghost{border:none;background:var(--t-fafafa);color:var(--text);box-shadow:0 6px 16px rgba(0,0,0,.06)}
:root .btn-primary{background:var(--primary);padding:15px;box-shadow:0 10px 24px rgba(0,0,0,.18)}
:root .modal,:root .drawer{background:var(--t-f7f7f7)}
:root .modal{border-radius:30px}
:root .drawer-head{background:var(--t-f7f7f7);border-bottom:none}
:root .overlay,:root .drawer-overlay{background:rgba(20,20,20,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
:root .saved-item,:root .new-btn{background:var(--t-ebebeb);border:none;border-radius:20px}
:root .saved-item.active{background:var(--t-e3dfdd)}
:root .toast{background:var(--primary);border-radius:999px}
:root .dock-inner{border-radius:40px;padding:6px;backdrop-filter:none;-webkit-backdrop-filter:none}
:root .dock-item{border-radius:34px;font-weight:500;font-size:12px}
.dock-item{transition:background .35s cubic-bezier(.22,1,.36,1),color .25s,transform .2s}
.card,.stat{animation:softIn .5s cubic-bezier(.22,1,.36,1) both}
.stat:nth-child(2){animation-delay:.05s}.stat:nth-child(3){animation-delay:.1s}
@keyframes softIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tab.active{animation:softIn .4s cubic-bezier(.22,1,.36,1)}
.btn:active,.icon-btn:active,.dock-item:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{
  --t-0c4a6e:#0c4a6e; --t-334155:#334155; --t-3a3a3a:#3a3a3a; --t-64748b:#64748b; --t-7a7a7a:#7a7a7a; --t-92400e:#92400e; --t-bae6fd:#bae6fd; --t-cbd5e1:#cbd5e1; --t-dbeafe:#dbeafe; --t-dcdcdc:#dcdcdc; --t-e0f2fe:#e0f2fe; --t-e3dfdd:#e3dfdd; --t-ebebeb:#ebebeb; --t-ededed:#ededed; --t-eef2ff:#eef2ff; --t-f0f9ff:#f0f9ff; --t-f1f5f9:#f1f5f9; --t-f4f4f4:#f4f4f4; --t-f6f6f6:#f6f6f6; --t-f7f7f7:#f7f7f7; --t-f8fafc:#f8fafc; --t-fafafa:#fafafa; --t-fde68a:#fde68a; --t-fef3c7:#fef3c7; --t-fff:#fff; --t-fffbeb:#fffbeb; --t-overlay:rgba(15,23,42,.4); --t-header:rgba(247,247,247,.85); --input-border:#bdbdbd;
}

/* ===== Тёмная тема: та же монохромная вёрстка, цвета инвертированы ===== */
[data-theme="dark"]{
  color-scheme:dark;
  --t-0c4a6e:#e0f2fe; --t-334155:#cbd5e1; --t-3a3a3a:#cbd5e1; --t-64748b:#94a3b8; --t-7a7a7a:#94a3b8; --t-92400e:#fcd34d; --t-bae6fd:#1e3a5f; --t-cbd5e1:#334155; --t-dbeafe:#1e3a5f; --t-dcdcdc:#334155; --t-e0f2fe:#0e2238; --t-e3dfdd:#273449; --t-ebebeb:#1e293b; --t-ededed:#1e293b; --t-eef2ff:#111b33; --t-f0f9ff:#0c1a2e; --t-f1f5f9:#1e293b; --t-f4f4f4:#151c2c; --t-f6f6f6:#0f1729; --t-f7f7f7:#0f1729; --t-f8fafc:#0b1120; --t-fafafa:#0f172a; --t-fde68a:#5c4312; --t-fef3c7:#2a1f08; --t-fff:#111827; --t-fffbeb:#2a1f08; --t-overlay:rgba(0,0,0,.6); --t-header:rgba(11,17,32,.88); --input-border:#475569;
  --bg:#0b1120; --card:#111827; --text:#f1f5f9; --muted:#94a3b8; --soft:#64748b;
  --primary:#e2e8f0; --primary-hover:#cbd5e1;
  --emerald:#e2e8f0; --emerald-bg:#273449; --emerald-text:#f1f5f9;
  --rose:#e2e8f0; --rose-bg:#273449; --rose-text:#f1f5f9;
  --sky:#e2e8f0; --sky-bg:#273449; --sky-text:#cbd5e1;
  --amber:#e2e8f0; --amber-bg:#273449; --amber-text:#cbd5e1; --indigo:#e2e8f0;
  --dock-bg:rgba(30,41,59,.38); --dock-border:rgba(255,255,255,.14); --dock-hl:rgba(255,255,255,.22);
  --dock-shadow:0 18px 40px rgba(0,0,0,.45); --dock-item:#94a3b8;
  --dock-active-bg:#273449; --dock-active-text:#f1f5f9; --dock-active-border:transparent;
}
html[data-theme="dark"]{background:#0b1120}

/* Поля ввода: видимая обводка в обеих темах, чтобы было понятно, куда нажать */
:root .field-input input,:root .price-input input,:root .modal input{
  border:1.5px solid var(--input-border);
}
:root .field-input input:focus,:root .price-input input:focus,:root .modal input:focus{

function fmt(n){return isFinite(n)?new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(n):"—"}
function money(n){return isFinite(n)?fmt(n)+" сом":"—"}
// С точностью до сотых — для метров, курса и цены ткани
function dec(n){n=isFinite(n)?n:0;return new Intl.NumberFormat("ru-RU",{maximumFractionDigits:2}).format(n)}

      for(var k in c.params)p[k]=c.params[k];

function calc(){

  var delivery=num(params.deliveryPerKg)*num(params.weightKg);

  // Комиссия WB в % считается отдельно и списывается с цены продажи
  var wb=sp*num(params.wbCommission)/100;
  // Логистика WB и ДРР — тоже % от цены продажи, вне себестоимости
  var logistics=sp*num(params.wbLogistics)/100;
  var drr=sp*num(params.drr)/100;
  var margin=sp-total-wb-logistics-drr;
  var marginPct=sp>0?margin/sp*100:0;
  var roi=total>0?margin/total*100:0;
  return {fabric:fabric,pricePerM:pricePerM,delivery:delivery,wb:wb,logistics:logistics,drr:drr,total:total,margin:margin,marginPct:marginPct,roi:roi,sp:sp};
}

function renderFields(containerId, fields, extraHintFn){
  var c=document.getElementById(containerId);
  c.innerHTML="";
  fields.forEach(function(f){
    var label=document.createElement("label");
    label.className="field";
    var hint=extraHintFn?extraHintFn(f):f.hint;
    label.innerHTML=
      '<div class="field-head"><span class="field-icon">'+(ICONS[f.icon]||"")+'</span><span class="field-label">'+f.label+'</span></div>'+
      '<div class="field-input"><input type="number" min="0" step="any" inputmode="decimal" data-key="'+f.key+'" value="'+(isEmptyVal(params[f.key])?"":params[f.key])+'" placeholder="0">'+(f.suffix?'<span class="field-suffix">'+f.suffix+'</span>':"")+'</div>'+
      '<p class="field-hint">'+hint+'</p>';
    var inp=label.querySelector("input");
    inp.addEventListener("input",function(e){
      params[f.key]=e.target.value===""?NaN:Number(e.target.value);
      update();
    });
    c.appendChild(label);
  });
}

function renderStats(c){
  var profitable=c.margin>=0;
  var stats=[
    {label:"Маржа",value:money(c.margin),sub:fmtPct(c.marginPct),icon:ICONS.trending,tone:profitable?"emerald":"rose"},
    {label:"ROI",value:fmtPct(c.roi),sub:"",icon:ICONS.gauge,tone:c.roi>=0?"sky":"rose"},
    {label:"Себестоим.",value:money(c.total),sub:"на 1 изделие",icon:ICONS.target,tone:"amber"}
  ];
  document.getElementById("stats").innerHTML=stats.map(function(s){
    return '<div class="stat stat-'+s.tone+'">'+
      '<div class="stat-icon">'+s.icon+'</div>'+
      '<div class="stat-label">'+s.label+'</div>'+
      '<div class="stat-value">'+s.value+'</div>'+
      (s.sub?'<div class="stat-sub">'+s.sub+'</div>':"")+
      '<div class="stat-bar"></div></div>';
  }).join("");
}

function renderFabricResult(c){
  var el=document.getElementById("fabric-result");
  el.innerHTML=
    '<div class="fabric-result-label">Расход ткани на изделие</div>'+
    '<div class="fabric-result-value">'+money(c.fabric)+'</div>'+
    '<div class="fabric-result-formula">(('+dec(num(params.fabricPriceUsd))+' $ × '+dec(num(params.exchangeRate))+' сом) ÷ '+dec(num(params.lengthPerKg))+' м) × '+dec(num(params.fabricConsumption))+' м</div>';
}

function renderBreakdown(c){
  var items=[
    {label:"Ткань",amt:c.fabric},{label:"Пошив",amt:num(params.sewing)},
    {label:"Фурнитура",amt:num(params.furniture)},{label:"Доставка",amt:c.delivery},
    {label:"Услуга ФФ",amt:num(params.ff)}
  ];
  document.getElementById("break-total").textContent=money(c.total);
  document.getElementById("breakdown").innerHTML=items.map(function(it,i){
    var w=c.total>0?Math.max(it.amt/c.total*100,0):0;
    return '<div class="break-row"><span class="break-label">'+it.label+'</span>'+
      '<div class="break-bar"><div class="break-fill" style="width:'+w+'%;background:'+BAR_COLORS[i%BAR_COLORS.length]+'"></div></div>'+
      '<span class="break-amt">'+fmt(it.amt)+'</span></div>';
  }).join("");
}

function renderDeliveryResult(c){
  document.getElementById("delivery-result").innerHTML=
    '<div class="fabric-result-label">Доставка на изделие</div>'+
    '<div class="fabric-result-value">'+money(c.delivery)+'</div>'+
    '<div class="fabric-result-formula">'+dec(num(params.deliveryPerKg))+' сом/кг × '+dec(num(params.weightKg))+' кг</div>';
}

function renderProfit(c){
  var el=document.getElementById("be-alert");
  if(isEmptyVal(params.sellingPrice)){
    el.className="alert alert-muted";
    el.innerHTML="Введите цену продажи, чтобы увидеть результат.";
    return;
  }
  var profitable=c.margin>=0;
  el.className="alert "+(profitable?"alert-emerald":"alert-rose");
  el.innerHTML=profitable
    ?"Прибыльно: +"+money(c.margin)+" с единицы (ROI "+fmtPct(c.roi)+")."
    :"Убыточно: не хватает "+money(Math.abs(c.margin))+" до безубытка. Поднимите цену до "+money(c.total)+".";
}

function update(){
  var c=calc();
  renderStats(c);
  renderFabricResult(c);
  renderDeliveryResult(c);
  renderBreakdown(c);
  renderProfit(c);
  WB_FIELDS.forEach(function(f){
    var inp=document.querySelector('[data-key="'+f.key+'"]');
    if(!inp)return;
    var hint=inp.closest(".field").querySelector(".field-hint");
    var amt=wbAmount(f.key,c);
    hint.textContent=(isEmptyVal(params[f.key])||amt===0)?f.hint:"−"+money(amt)+" с каждой продажи";
  });
  var fc=document.querySelector('[data-key="fabricConsumption"]');
  if(fc){
    var p=fc.closest(".field").querySelector(".field-hint");
    if(p) p.textContent="Итог: "+money(c.fabric)+" за изделие · цена "+money(c.pricePerM)+"/м";
  }
}

function initFields(){
  var sp=document.getElementById("f-sellingPrice");
  sp.placeholder="0";
  sp.value=isEmptyVal(params.sellingPrice)?"":params.sellingPrice;
  sp.addEventListener("input",function(e){
    params.sellingPrice=e.target.value===""?NaN:Number(e.target.value);
    update();
  });
  renderFields("fabric-fields",FABRIC_FIELDS,function(f){
    if(f.key==="fabricConsumption"){
      var c=calc();
      return "Итог: "+money(c.fabric)+" за изделие · цена "+money(c.pricePerM)+"/м";
    }
    return f.hint;
  });
  renderFields("cost-fields",COST_FIELDS);
  renderFields("delivery-fields",DELIVERY_FIELDS);
  renderFields("wb-fields",WB_FIELDS,function(f){
    var c=calc();
    var amt=wbAmount(f.key,c);
    return isEmptyVal(params[f.key])||amt===0?f.hint:"−"+money(amt)+" с каждой продажи";
  });
  update();
}

function reset(){
  params=clone(DEFAULTS);
  currentId=null; currentName="";
  document.getElementById("h-title").textContent="Новый расчёт";
  document.getElementById("save-label").textContent="Сохранить";
  initFields();
}

var toastTimer;
function toast(msg){
  var existing=document.querySelector(".toast");
  if(existing) existing.remove();
  var el=document.createElement("div");
  el.className="toast"; el.textContent=msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){el.remove()},2200);
}

function openSave(){
  var name=currentName||"Новый расчёт";
  var ov=document.createElement("div");
  ov.className="overlay";
  ov.innerHTML=
    '<div class="modal">'+
      '<div class="modal-head"><h3>'+(currentId?"Переименовать":"Сохранить расчёт")+'</h3>'+
      '<button class="modal-close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>'+
      '<input type="text" id="save-name" placeholder="Напр. Футболка оверсайз" value="'+escapeHtml(name)+'">'+
      '<button class="btn btn-primary" id="save-confirm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Сохранить</button>'+
    '</div>';
  document.body.appendChild(ov);
  var inp=ov.querySelector("#save-name"); inp.focus(); inp.select();
  function close(){ov.remove()}
  ov.addEventListener("click",function(e){if(e.target===ov)close()});
  ov.querySelector(".modal-close").addEventListener("click",close);
  function doSave(){
    var n=inp.value.trim()||"Без названия";
    var items=loadAll();
    if(currentId){
      items=items.map(function(it){return it.id===currentId?{id:it.id,name:n,params:clone(params),created_at:it.created_at,updated_at:new Date().toISOString()}:it});
      persist(items); currentName=n;
      document.getElementById("h-title").textContent=n;
      document.getElementById("save-label").textContent="Обновить";
      toast("Расчёт обновлён");
    }else{
      var now=new Date().toISOString();
      var item={id:uid(),name:n,params:clone(params),created_at:now,updated_at:now};
      items.unshift(item); persist(items);
      currentId=item.id; currentName=n;
      document.getElementById("h-title").textContent=n;
      document.getElementById("save-label").textContent="Обновить";
      toast("Расчёт сохранён");
    }
    close();
  }
  ov.querySelector("#save-confirm").addEventListener("click",doSave);
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")doSave()});
}

function openList(){
  var items=loadAll();
  var ov=document.createElement("div");
  ov.className="drawer-overlay";
  ov.innerHTML='<div class="drawer"></div>';
  document.body.appendChild(ov);
  var dr=ov.querySelector(".drawer");
  function render(){
    items=loadAll();
    dr.innerHTML=
      '<div class="drawer-head"><h3>Мои расчёты</h3>'+
      '<button class="modal-close" id="drawer-x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>'+
      '<div class="drawer-body">'+
        '<button class="new-btn" id="new-calc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Новый расчёт</button>'+
        (items.length===0?'<p class="empty">Нет сохранённых расчётов</p>':
          items.map(function(c){
            var d=new Date(c.updated_at);
            return '<div class="saved-item'+(c.id===currentId?" active":"")+'">'+
              '<button class="saved-open" data-id="'+c.id+'">'+
                '<div class="saved-info"><div class="saved-name">'+escapeHtml(c.name)+'</div>'+
                '<div class="saved-meta">'+d.toLocaleDateString("ru-RU",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+' · цена '+fmt(c.params.sellingPrice)+' сом</div></div>'+
                '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>'+
              '</button>'+
              '<button class="saved-del" data-del="'+c.id+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>'+
            '</div>';
          }).join("") )+
      '</div>';
    dr.querySelector("#drawer-x").addEventListener("click",close);
    dr.querySelector("#new-calc").addEventListener("click",function(){reset();close()});
    dr.querySelectorAll(".saved-open").forEach(function(b){
      b.addEventListener("click",function(){
        var id=b.getAttribute("data-id");
        var it=items.find(function(x){return x.id===id});
        if(it){params=clone(it.params);currentId=it.id;currentName=it.name;
          document.getElementById("h-title").textContent=it.name;
          document.getElementById("save-label").textContent="Обновить";
          initFields();close();}
      });
    });
    dr.querySelectorAll(".saved-del").forEach(function(b){
      b.addEventListener("click",function(){
        var id=b.getAttribute("data-del");
        var all=loadAll().filter(function(x){return x.id!==id});
        persist(all);
        if(id===currentId){currentId=null;currentName="";document.getElementById("h-title").textContent="Новый расчёт";document.getElementById("save-label").textContent="Сохранить";}
        toast("Удалено");render();
      });
    });
  }
  function close(){ov.remove()}
  ov.addEventListener("click",function(e){if(e.target===ov)close()});
  render();
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g,function(m){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]})}

// Install hint for iOS
function detectInstallHint(){
  var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  var isStandalone=window.navigator.standalone===true||window.matchMedia("(display-mode: standalone)").matches;
  if(isIOS&&!isStandalone){
    var el=document.getElementById("install-hint");
    el.style.display="flex";
    document.getElementById("install-text").innerHTML="<strong>Добавьте на главный экран:</strong> нажмите «Поделиться» ↓ «На экран Домой», чтобы запускать как приложение без браузера.";
  }else if(!isStandalone&&window.matchMedia("(display-mode: browser)").matches&&!isIOS){
    var el2=document.getElementById("install-hint");
    el2.style.display="flex";
    document.getElementById("install-text").innerHTML="<strong>Установите как приложение:</strong> меню браузера (⋮) → «Установить приложение» или «Добавить на главный экран».";
  }
}

var TAB_TITLES={
  unit:{title:function(){return currentName||"Новый расчёт"},sub:"Юнит-экономика одежды · сом",list:true},
  data:{title:function(){return "Data Base"},sub:"Номенклатура",list:false},
  orders:{title:function(){return "Заказы"},sub:"Раздел в работе",list:false}
};
var currentTab="unit";
function showTab(name){
  currentTab=name;
  document.querySelectorAll(".tab").forEach(function(t){t.classList.toggle("active",t.id==="tab-"+name)});
  document.querySelectorAll(".dock-item").forEach(function(b){b.classList.toggle("active",b.getAttribute("data-tab")===name)});
  var cfg=TAB_TITLES[name];
  document.getElementById("h-title").textContent=cfg.title();
  document.getElementById("h-sub").textContent=cfg.sub;
  document.getElementById("header-actions").style.display=cfg.list?"flex":"none";
  document.getElementById("screens").scrollTop=0;
}
document.querySelectorAll(".dock-item").forEach(function(b){
  b.addEventListener("click",function(){showTab(b.getAttribute("data-tab"))});
});

// Тема: светлая / тёмная, запоминается на устройстве
var THEME_KEY="clothing-calc-theme";
function applyTheme(t){
  if(t==="dark")document.documentElement.setAttribute("data-theme","dark");
  else document.documentElement.removeAttribute("data-theme");
  var m=document.querySelector('meta[name="theme-color"]');
  if(m)m.setAttribute("content",t==="dark"?"#0b1120":"#0f172a");
  var b=document.getElementById("btn-theme");
  b.innerHTML=t==="dark"?ICONS.sun:ICONS.moon;
  b.setAttribute("aria-label",t==="dark"?"Светлая тема":"Тёмная тема");
}
document.getElementById("btn-theme").addEventListener("click",function(){
  var next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  try{localStorage.setItem(THEME_KEY,next)}catch(e){}
  applyTheme(next);
});
applyTheme(document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light");

document.getElementById("btn-reset").addEventListener("click",reset);
document.getElementById("btn-save").addEventListener("click",openSave);
document.getElementById("btn-list").addEventListener("click",openList);

initFields();
detectInstallHint();
document.getElementById("app").style.display="flex";

// Офлайн-режим: работает, если рядом лежит sw.js (на GitHub Pages / сервере)
if("serviceWorker" in navigator && location.protocol!=="file:"){
  window.addEventListener("load",function(){navigator.serviceWorker.register("./sw.js").catch(function(){})});
}
})();
</script>
<script>
(function(){
  var KEY="clothing-calc-nomenclature";
  var $=function(id){return document.getElementById(id)};
  var HEAD=["Артикул","Размер","ШК","Gtin"];

  function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
  function save(d){try{localStorage.setItem(KEY,JSON.stringify(d));return true}catch(e){return false}}
  function clean(v){return v===null||v===undefined?"":String(v).trim()}
  function norm(v){return clean(v).toLowerCase().replace(/\s+/g,"")}
  function findCol(headers,names){
    for(var i=0;i<headers.length;i++){if(names.indexOf(norm(headers[i]))!==-1)return i}
    return -1;
  }
  function showError(msg){var el=$("nom-error");el.textContent=msg||"";el.hidden=!msg}
  function fmtDate(iso){
    try{return new Date(iso).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})}
    catch(e){return ""}
  }

  function render(){
    var d=load();
    var items=d&&d.items&&d.items.length?d.items:[];
    $("nom-card").hidden=!items.length;
    $("nom-empty").hidden=!!items.length;
    $("btn-export").disabled=!items.length;
    var box=$("nom-rows"); box.textContent="";
    if(!items.length){$("nom-info").textContent="Список пуст. Загрузите файл Excel.";return}
    $("nom-info").textContent=d.fileName+" · позиций: "+items.length+" · загружено "+fmtDate(d.importedAt);
    items.forEach(function(it){
      var row=document.createElement("div");
      row.className="nom-row";
      [it.articul,it.size,it.sk,it.gtin].forEach(function(v){
        var sp=document.createElement("span");sp.textContent=v;row.appendChild(sp);
      });
      box.appendChild(row);
    });
  }

  function importFile(file){
    showError("");
    if(typeof XLSX==="undefined"){showError("Не загрузилась библиотека Excel. Проверьте интернет и попробуйте снова.");return}
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
        var sheet=wb.Sheets[wb.SheetNames[0]];
        var rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:"",raw:false,blankrows:false});
        if(!rows.length){showError("Файл пустой.");return}
        var h=rows[0];
        var idx={art:findCol(h,["артикул"]),size:findCol(h,["размер"]),sk:findCol(h,["шк","sk"]),gtin:findCol(h,["gtin"])};
        if(idx.art<0){showError("В файле нет столбца «Артикул». Используйте шаблон.");return}
        var items=[];
        rows.slice(1).forEach(function(r){
          var it={
            articul:clean(r[idx.art]),
            size:idx.size>=0?clean(r[idx.size]):"",
            sk:idx.sk>=0?clean(r[idx.sk]):"",
            gtin:idx.gtin>=0?clean(r[idx.gtin]):""
          };
          if(it.articul||it.size||it.sk||it.gtin)items.push(it);
        });
        if(!items.length){showError("В файле нет строк с данными.");return}
        // Новый файл полностью заменяет предыдущий список
        if(!save({fileName:file.name,importedAt:new Date().toISOString(),items:items})){
          showError("Не удалось сохранить список на этом устройстве.");return;
        }
        render();
      }catch(err){
        showError("Не удалось прочитать файл. Сохраните его как .xlsx и попробуйте снова.");
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function exportList(){
    var d=load();
    if(!d||!d.items||!d.items.length)return;
    var aoa=[HEAD].concat(d.items.map(function(it){return [it.articul,it.size,it.sk,it.gtin]}));
    var ws=XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"]=[{wch:18},{wch:12},{wch:20},{wch:20}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Номенклатура");
    XLSX.writeFile(wb,"nomenclature_"+new Date().toISOString().slice(0,10)+".xlsx");
  }

  function downloadTemplate(){
    var ws=XLSX.utils.aoa_to_sheet([HEAD]);
    ws["!cols"]=[{wch:18},{wch:12},{wch:20},{wch:20}];
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Номенклатура");
    XLSX.writeFile(wb,"nomenclature_template.xlsx");
  }

  $("btn-import").addEventListener("click",function(){$("nom-file").click()});
  $("nom-file").addEventListener("change",function(e){
    var f=e.target.files&&e.target.files[0];
    if(f)importFile(f);
    e.target.value="";
  });
  $("btn-export").addEventListener("click",function(){
    if(typeof XLSX==="undefined"){showError("Не загрузилась библиотека Excel. Проверьте интернет.");return}
    exportList();
  });
  $("btn-template").addEventListener("click",function(){
    if(typeof XLSX==="undefined"){showError("Не загрузилась библиотека Excel. Проверьте интернет.");return}
    downloadTemplate();
  });
  render();

  // Страница не должна уезжать: iOS иногда сдвигает её после клавиатуры, и док остаётся выше края
  function pin(){if(window.scrollX||window.scrollY)window.scrollTo(0,0)}
  window.addEventListener("scroll",pin,{passive:true});
  document.addEventListener("focusout",function(){setTimeout(pin,300)});
})();
</script>
</body>
